<!DOCTYPE html>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  color:gold;
  font-size:22px;
  font-weight:bold;
}

/* HERO */
.hero{
  text-align:center;
  padding:50px 20px;
  background:linear-gradient(to right,#000,#222);
}

.hero h1{color:gold;}

.btn{
  background:gold;
  color:black;
  padding:10px 15px;
  margin:5px;
  display:inline-block;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

/* SEARCH */
.search-box{
  margin-top:15px;
  padding:10px;
  width:80%;
  max-width:400px;
  border-radius:8px;
  border:none;
}

/* PRODUCTS */
.products{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:#151515;
  border:1px solid gold;
  padding:15px;
  border-radius:10px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}

button{
  padding:8px;
  margin:3px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.add{background:gold;}
.minus{background:#ffcc00;}
.remove{background:red;color:white;}
.wish{background:#333;color:white;}

/* FLOATING CART BUTTON */
.cart-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  background:gold;
  color:black;
  padding:15px;
  border-radius:50px;
  font-weight:bold;
  cursor:pointer;
  z-index:2000;
}

/* SIDE CART */
.cart{
  position:fixed;
  right:-400px;
  top:0;
  width:320px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.4s;
  overflow-y:auto;
  border-left:2px solid gold;
  z-index:3000;
}

.cart.open{
  right:0;
}

.cart h2{
  color:gold;
}

.cart li{
  margin:10px 0;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  z-index:2500;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:gold;
  color:black;
  padding:10px;
  border-radius:8px;
  display:none;
}

/* MOBILE */
@media(max-width:600px){
  .cart{
    width:100%;
  }
}
</style>
</head>

<!-- SIDE CART -->

<h3>Total: $<span id="total">0</span></h3>

<button onclick="checkout()">Checkout WhatsApp</button>

</div>

<div class="toast" id="toast"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let wishes = JSON.parse(localStorage.getItem("wish")) || [];

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
  localStorage.setItem("wish", JSON.stringify(wishes));
}

function toast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1200);
}

function add(name,price){
  let item = cart.find(i=>i.name===name);
  if(item) item.qty++;
  else cart.push({name,price,qty:1});

  save();
  toast("Added " + name);
  render();
}

function minus(name){
  let item = cart.find(i=>i.name===name);
  if(!item) return;

  item.qty--;
  if(item.qty<=0){
    cart = cart.filter(i=>i.name!==name);
  }

  save();
  render();
}

function removeItem(name){
  cart = cart.filter(i=>i.name!==name);
  save();
  render();
}

function wishlist(name){
  if(!wishes.includes(name)){
    wishes.push(name);
  } else {
    wishes = wishes.filter(i=>i!==name);
  }
  save();
  render();
}

/* CART DRAWER */
function toggleCart(){
  document.getElementById("cart").classList.toggle("open");
  document.getElementById("overlay").style.display =
    document.getElementById("cart").classList.contains("open") ? "block" : "none";
}

function render(){

  let list=document.getElementById("list");
  list.innerHTML="";
  let total=0;

  cart.forEach(i=>{
    total+=i.price*i.qty;
    let li=document.createElement("li");
    li.innerHTML=`${i.name} x${i.qty} = $${i.price*i.qty}`;
    list.appendChild(li);
  });

  document.getElementById("total").innerText=total;
  document.getElementById("cartCount").innerText=cart.length;
}

function checkout(){

  if(cart.length===0){
    alert("Cart empty!");
    return;
  }

  let msg="🛍 Ramu Boutique Order\n\n";
  let total=0;

  cart.forEach(i=>{
    let t=i.price*i.qty;
    total+=t;
    msg+=`• ${i.name} x${i.qty} = $${t}\n`;
  });

  msg+=`\nTOTAL: $${total}`;

  window.open("https://wa.me/2207597080?text="+encodeURIComponent(msg), "_blank");
}

function clearCart(){
  cart=[];
  save();
  render();
}

function filterProducts(){
  let input=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    let name=card.querySelector("h3").innerText.toLowerCase();
    card.style.display=name.includes(input)?"block":"none";
  });
}

render();

</script>
